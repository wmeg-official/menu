<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>STAND MENU</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="메뉴판">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f5">

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    body {
      font-family: 'Titillium Web', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f0f0f0;
      color: #222;
      -webkit-tap-highlight-color: transparent;
    }

    .scroll-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
      padding-top: env(safe-area-inset-top);
    }

    /* 홈화면 추가 안내 배너 */
    .install-guide {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 16px 20px;
      z-index: 300;
      text-align: center;
      animation: slideUp 0.3s ease-out;
    }

    .install-guide.show {
      display: block;
    }

    .install-guide p {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    .install-guide strong {
      color: #222;
    }

    .install-guide .dismiss {
      margin-top: 10px;
      background: #222;
      border: none;
      color: #fff;
      padding: 8px 24px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 헤더 */
    .header {
      background: #fff;
      padding: 20px 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .store-name {
      font-size: 30px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 5px;
      color: #222;
      padding-bottom: 16px;
    }

    /* 탭 */
    .tabs {
      display: flex;
      border-top: 1px solid #eee;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 13px 0;
      font-size: 14px;
      font-weight: 700;
      color: #bbb;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tab.active {
      color: #222;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      width: 60%;
      height: 2px;
      background: #222;
    }

    /* 메뉴 리스트 */
    .menu-container {
      padding: 8px 16px 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 빈 타이틀은 기본적으로 숨김 (세로 모드) */
    .empty-title {
      display: none;
    }

    /* 가로 모드 (아이패드 landscape) — 2단 컬럼 */
    @media (orientation: landscape) and (min-width: 900px) {
      .menu-container {
        max-width: 960px;
        column-count: 2;
        column-gap: 60px;
        padding: 8px 32px 40px;
      }

      /* FOOD 탭은 1단으로 */
      .menu-container.tab-food {
        column-count: 1 !important;
        max-width: 600px !important;
        padding-top: 8px !important;
      }

      .menu-item,
      .category-title,
      .bean-info {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .bean-info {
        column-span: all;
      }

      .menu-container {
        padding-top: 40px;
      }

      /* 컬럼 첫 요소들은 margin 대신 컨테이너 padding으로 위치 고정
         (multi-column에서 margin-top이 브라우저마다 다르게 처리되는 문제 회피) */
      .category-title:first-child,
      .bean-info + .category-title,
      .category-title.column-break,
      .empty-title {
        margin-top: 0 !important;
        padding-top: 0 !important;
      }

      .category-title.column-break {
        break-before: column;
      }

      .column-break-spacer {
        break-before: column;
      }

      .empty-title {
        display: block;
        visibility: hidden;
      }

      /* COFFEE 탭: SPECIAL 위쪽에 여백 추가 (empty-title도 동일하게 맞춤) */
      .menu-container.tab-coffee .category-title.column-break,
      .menu-container.tab-coffee .empty-title {
        padding-top: 32px !important;
      }
    }

    .bean-info {
      background: #fff;
      padding: 18px 20px;
      border-radius: 10px;
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .bean-info-main {
      flex: 1;
      min-width: 240px;
      text-align: left;
    }

    .bean-info-blend {
      font-size: 15px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .bean-info-roast {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      letter-spacing: 1px;
    }

    .bean-info-decaf {
      flex: 1;
      min-width: 240px;
      padding-left: 24px;
      border-left: 1px solid #eee;
      font-size: 15px;
      font-weight: 700;
      color: #444;
      text-align: left;
      line-height: 1.8;
    }

    .bean-info-sub {
      font-size: 13px;
      font-weight: 500;
      color: #999;
    }

    .bean-info-price {
      color: #d33;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .bean-info-decaf {
        padding-left: 0;
        padding-top: 12px;
        border-left: none;
        border-top: 1px solid #eee;
      }
    }

    .category-title {
      font-size: 13px;
      color: #999;
      font-weight: 700;
      margin: 60px 0 8px;
      padding-left: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .category-title:first-child,
    .bean-info + .category-title {
      margin-top: 16px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 20px 4px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      transition: background 0.15s;
    }

    .menu-item:active {
      background: rgba(0, 0, 0, 0.03);
    }

    .menu-left {
      flex: 1;
      min-width: 0;
    }

    .menu-name {
      font-size: 22px;
      font-weight: 700;
      color: #222;
    }

    .hotice {
      font-size: 15px;
      font-weight: 700;
      color: #999;
      margin-left: 10px;
      letter-spacing: 1px;
    }

    .menu-name-kr {
      font-size: 15px;
      font-weight: 500;
      color: #aaa;
      margin-left: 8px;
    }

    .abv {
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      margin-left: 6px;
      letter-spacing: 0.5px;
    }

    .caution {
      font-size: 12px;
      font-weight: 700;
      color: #d33;
      margin-left: 8px;
    }

    .soldout {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: #999;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
    }

    .soldout.comingsoon {
      background: #4a7ab5;
    }

    .menu-brief {
      font-size: 14px;
      color: #666;
      margin-top: 6px;
      padding-left: 12px;
      font-weight: 600;
    }

    .menu-right {
      display: flex;
      align-items: center;
    }

    .menu-price {
      font-size: 20px;
      font-weight: 700;
      color: #555;
      white-space: nowrap;
    }

    /* 모달 오버레이 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
      animation: fadeIn 0.2s;
    }

    .modal-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal {
      background: #fff;
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    .modal-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 16px 16px 0 0;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px 16px 0 0;
    }

    .modal-body {
      padding: 24px 20px 40px;
    }

    .modal-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #222;
    }

    .modal-price {
      font-size: 18px;
      color: #222;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .modal-desc {
      font-size: 14px;
      color: #777;
      line-height: 1.7;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      background: rgba(0, 0, 0, 0.4);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .img-placeholder {
      width: 100%;
      height: 240px;
      background: #e8e8e8;
      border-radius: 16px 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }
  </style>
</head>

<body>

  <div class="scroll-area" id="scrollArea">
    <div class="header">
      <div class="store-name">STAND</div>
      <div class="tabs">
        <div class="tab active" data-tab="coffee">COFFEE</div>

        <div class="tab" data-tab="beer">BEER</div>
        <div class="tab" data-tab="food">FOOD</div>
      </div>
    </div>

    <div class="menu-container" id="menuContainer"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-wrapper">
      <div class="modal" id="modal">
        <div id="modalImage" class="img-placeholder"></div>
        <div class="modal-body">

          <div class="modal-price" id="modalPrice"></div>
          <div class="modal-desc" id="modalDesc"></div>

      <button class="modal-close" id="modalClose">&times;</button>

    <button class="dismiss" id="dismissGuide">확인</button>
  </div>

              { name: '캐모마일', price: '5,000', hotice: true, desc: '은은한 꽃향으로 마음이 편안해지는 허브티입니다.', emoji: '🌼' },
              { name: '꿀 캐모마일', price: '5,000', hotice: true, desc: '캐모마일에 달콤한 꿀을 더해 더욱 부드러운 허브티입니다.', emoji: '🍯' },
              { name: 'Yellow Cream', nameKr: '과일블렌드', price: '5,000', brief: ['사과조각 71%, 건조사과다이스 8%, 스피어민트잎 5% 등'], hotice: true, desc: '상큼한 사과와 스피어민트, 금잔화꽃이 어우러진 과일 블렌드 티입니다.', emoji: '🍎' },
              { name: '밀크티', price: '5,000', soldOut: true, brief: ['<span class="caution">고당도</span>'], hotice: true, desc: '진한 홍차에 우유와 시럽을 더한 달콤한 밀크티입니다.', emoji: '🥤' },
            ]
          }
        ]
      },
      food: {
        categories: [
          {
            title: '',
            items: [
              { name: '프레즐', price: '3,000', brief: ['미니 트위스트'], desc: '짭짤하고 바삭한 미니 트위스트 프레즐입니다.', emoji: '🥨' },
              { name: '감자튀김', price: '5,500', desc: '바삭하게 튀겨낸 감자튀김입니다.', emoji: '🍟' },
              { name: '어묵튀김', price: '5,500', desc: '바삭한 어묵튀김입니다.', emoji: '🍢' },
              { name: '팝콘치킨', price: '6,000', desc: '한입 사이즈로 튀겨낸 바삭한 팝콘치킨입니다.', emoji: '🍗' },
              { name: '나초', price: '6,000', desc: '바삭한 나초칩에 치즈와 살사 소스를 곁들인 인기 안주입니다.', emoji: '🌮' },
              { name: '육개장 컵라면 <span class="caution">22시 이후 판매</span>', price: '3,500', brief: ['일반 / 김치'], desc: '얼큰한 육개장 컵라면. 일반 / 김치 맛 중 선택 가능합니다.', emoji: '🍜' },
            ]
          }
        ]
      }
    };

    const container = document.getElementById('menuContainer');
    const overlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    let activeTab = 'coffee';

    function renderRating(val, max = 5) {
      const full = Math.floor(val);
      const half = val - full >= 0.5 ? 1 : 0;
      const empty = max - full - half;
      return '●'.repeat(full) + '◐'.repeat(half) + '○'.repeat(empty);
    }

    function renderMenu(tab) {
      const data = menuData[tab];
      let html = '';

      if (data.info) {
        html += `
          <div class="bean-info">
            <div class="bean-info-main">
              <div class="bean-info-blend">${data.info.blend}</div>
              <div class="bean-info-roast">미디엄다크로스팅</div>
            </div>
            <div class="bean-info-decaf">
              <div>
                <div>샷추가 <span class="bean-info-price">+300원</span> <span class="bean-info-sub">(1 샷)</span></div>
                <div>디카페인 <span class="bean-info-price">+300원</span> <span class="bean-info-sub">(콜롬비아 100%, 다크로스팅)</span></div>
              </div>
              <div>Take Out <span class="bean-info-price">-1,500원</span></div>
            </div>
          </div>`;
      }

      data.categories.forEach((cat, catIdx) => {
        if (cat.title) {
          const cbClass = cat.columnBreak ? ' column-break' : '';
          html += `<div class="category-title${cbClass}">${cat.title}</div>`;
        } else if (cat.columnBreak) {
          html += `<div class="column-break-spacer"></div>`;
        } else {
          const hasVisibleTitleLater = data.categories.slice(catIdx + 1).some(c => c.title);
          if (hasVisibleTitleLater) {
            html += `<div class="category-title empty-title">&nbsp;</div>`;
          }
        }
        cat.items.forEach((item, idx) => {
          const hoticeLabel = item.hotice === true ? 'HOT / ICE' : (typeof item.hotice === 'string' ? item.hotice : '');
          const hoticeHtml = hoticeLabel ? `<span class="hotice">${hoticeLabel}</span>` : '';
          const abvHtml = item.abv ? `<span class="abv">${item.abv}</span>` : '';
          const soldOutHtml = item.soldOut ? `<span class="soldout">SOLD OUT</span>` : (item.comingSoon ? `<span class="soldout comingsoon">COMING SOON</span>` : '');
          const briefLines = Array.isArray(item.brief) ? item.brief : (item.brief ? [item.brief] : []);
          const briefHtml = briefLines.map(line => `<div class="menu-brief">${line}</div>`).join('');

          html += `
        <div class="menu-item" data-tab="${tab}" data-cat="${cat.title}" data-idx="${idx}">
          <div class="menu-left">
            <div class="menu-name">${item.name}${item.nameKr ? ` <span class="menu-name-kr">${item.nameKr}</span>` : ''} ${abvHtml} ${hoticeHtml} ${soldOutHtml}</div>
            ${briefHtml}
          </div>
          <div class="menu-right">
            <span class="menu-price">${item.price}원</span>
          </div>
        </div>`;
        });
      });

      container.innerHTML = html;
      container.className = 'menu-container tab-' + tab;

      // FOOD 탭은 강제로 1단으로 (CSS가 캐싱 등으로 무시될 경우 대비)
      if (tab === 'food') {
        container.style.columnCount = '1';
        container.style.maxWidth = '600px';
      } else {
        container.style.columnCount = '';
        container.style.maxWidth = '';
      }

      // 메뉴 상세보기는 비활성화 (나중에 사용)
      // container.querySelectorAll('.menu-item').forEach(el => {
      //   el.addEventListener('click', () => {
      //     const t = el.dataset.tab;
      //     const catTitle = el.dataset.cat;
      //     const idx = parseInt(el.dataset.idx);
      //     const cat = menuData[t].categories.find(c => c.title === catTitle);
      //     const item = cat.items[idx];
      //     openModal(item);
      //   });
      // });
    }

    function openModal(item) {
      if (item.image) {
        document.getElementById('modalImage').innerHTML = `<img src="${item.image}" alt="${item.name}">`;
        document.getElementById('modalImage').className = 'modal-image';
      } else {
        document.getElementById('modalImage').innerHTML = item.emoji || '📷';
        document.getElementById('modalImage').className = 'img-placeholder';
      }
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalPrice').textContent = item.price + '원';
      document.getElementById('modalDesc').textContent = item.desc;
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        renderMenu(activeTab);
        const scrollArea = document.getElementById('scrollArea');
        if (scrollArea) scrollArea.scrollTo(0, 0);
      });
    });

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    renderMenu(activeTab);

    const isStandalone = window.navigator.standalone === true
      || window.matchMedia('(display-mode: standalone)').matches;

    if (!isStandalone && !localStorage.getItem('guide-dismissed')) {
      document.getElementById('installGuide').classList.add('show');
    }

    document.getElementById('dismissGuide').addEventListener('click', () => {
      document.getElementById('installGuide').classList.remove('show');
      localStorage.setItem('guide-dismissed', '1');
    });

    // iOS Safari pull-to-refresh / overscroll 방지
    const scrollArea = document.getElementById('scrollArea');
    let startY = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startY = e.touches[0].pageY;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      const y = e.touches[0].pageY;
      const scrollTop = scrollArea.scrollTop;
      const maxScroll = scrollArea.scrollHeight - scrollArea.clientHeight;
      // 최상단/최하단에서의 오버스크롤(바운스) 및 pull-to-refresh 차단
      if ((scrollTop <= 0 && y > startY) || (scrollTop >= maxScroll && y < startY)) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
